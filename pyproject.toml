[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-151"
version = "0.1.0"
description = "Exact principal amortization with period interest rounding"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
loan-schedule = "loan_schedule.cli:main"
contract-award = "loan_schedule.cli:contract_award_main"
meter-tou = "loan_schedule.cli:meter_tou_main"
table-keys = "loan_schedule.cli:table_keys_main"
cdc-materialize = "loan_schedule.cli:cdc_materialize_main"
[tool.setuptools.packages.find]
where = ["src"]
